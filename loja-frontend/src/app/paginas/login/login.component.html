<section class="cartao pequeno">
  <h1>Login</h1>

  <form (ngSubmit)="entrar()" novalidate>
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" [(ngModel)]="usuario" autocomplete="username" />

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" [(ngModel)]="senha" autocomplete="current-password" />

    <button type="submit" [disabled]="carregando()">Entrar</button>
  </form>
</section>
